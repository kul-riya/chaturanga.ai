services:
  mysql:
    image: mysql:8.0
    container_name: chess_mysql
    env_file: 
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql_init:/docker-entrypoint-initdb.d:ro
    ports:
      - "33306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chess_backend
    env_file:
      - .env
    environment:
      FLASK_ENV: production
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: ${MYSQL_DATABASE}
      DATABASE_USER: root
      DATABASE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT}:5000"
    volumes:
      - ./backend:/app
    command: ["/app/entrypoint.sh"]
    networks:
      - chessnet

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chess_frontend
    environment:
      VITE_BACKEND_URL: "http://host.docker.internal:${BACKEND_PORT}"
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT}:5173"
    volumes:
      - ./frontend:/usr/src/app
    networks:
      - chessnet

  engine:
    build:
      context: ./engine
      dockerfile: Dockerfile
    container_name: chess_engine
    restart: unless-stopped
    environment:
      ENGINE_PORT: 3001
      BACKEND_HOST: backend
      BACKEND_PORT: 5000
    depends_on:
      - backend
    ports:
      - "${ENGINE_PORT}:3001"
    volumes:
      - ./engine:/usr/src/engine
    networks:
      - chessnet

volumes:
  mysql_data:

networks:
  chessnet:
    driver: bridge

